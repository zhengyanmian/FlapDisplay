plugins {
    id "net.neoforged.moddev" version "2.0.141"
    // Shadow：把嵌入的第三方库重定位（relocate）到我们自己的包名下。
    // 【为什么必须重定位】2026-10-02 崩溃：YACL / 沉浸画框等 mod 也内置
    // twelvemonkeys（jarinjar，模块名 com.twelvemonkeys.imageio.core），
    // 而我们平铺嵌入的库让本模块也导出 com.twelvemonkeys.* 包 ——
    // JPMS 不允许两个模块导出同一包，模块解析阶段直接拒绝启动
    //（ResolutionException，发生在任何代码执行之前，运行时守卫救不了）。
    // 重定位后我们导出的是 com.flapdisplayplus.shaded.*，与任何 mod 都不可能冲突。
    id "com.gradleup.shadow" version "8.3.6"
}

group = "com.flapdisplayplus"
version = "1.1.5"

java.toolchain.languageVersion = JavaLanguageVersion.of(21)

// ===== 依赖仓库 =====
// 国内镜像优先；Create 及其传递依赖分散在下面这些 maven 仓库
repositories {
    // 项目内置本地仓库（curl 预下好的 jar）：twelvemonkeys 两个 jar 曾因
    // maven.neoforged.net 的 JVM 侧连接重置反复拉不到，放最前永久兜底。
    // ★ 必须用 file(...).toURI()：手拼 "file:///${projectDir}/..." 在 Windows 下
    //   会得到 file:///C:\Users\... 这种反斜杠 URI，Gradle 解析不到（静默跳过该仓库）。
    maven { url = file("libs/local-maven").toURI() }
    // NeoForged 官方仓库（moddev 插件与 neoforge 依赖的来源）。
    // 注意：该域名国内偶发 "Connection reset by peer"，构建失败多为网络抖动，重试即可。
    maven { url = "https://maven.neoforged.net/releases" }
    maven { url = "https://maven.aliyun.com/repository/public" }
    maven { url = "https://maven.createmod.net" }
    maven { url = "https://maven.ithundxr.dev/snapshots" }
    maven { url = "https://maven.blamejared.com" }
    maven { url = "https://maven.theillusivec4.top/" }
    maven { url = "https://api.modrinth.com/maven" }
    maven { url = "https://www.cursemaven.com" }
    maven { url = "https://raw.githubusercontent.com/Fuzss/modresources/main/maven" }
    mavenCentral()
}

neoForge {
    version = "21.1.219"

    mods {
        "flapdisplayplus" {
            sourceSet(sourceSets.main)
        }
    }

    runs {
        client {
            client()
        }
        server {
            server()
        }
    }
}

// ===== 平铺嵌入第三方 jar（避免 jarJar 嵌套触发 NeoForge SecureJar 读取 bug）=====
// zxing / jcodec / TwelveMonkeys 均为纯 Java，解压进 jar 根目录后即为普通 class 条目。
//
// 【为什么不用 configurations.runtimeClasspath】
// runtimeClasspath 里混有大量与 mod 打包无关的条目（如 moddev 插件的 DevLaunch、
// Flywheel 运行时等）。从中去"反查"需要的 jar，会把这些也一并拖进来解析：
// 离线构建直接失败（DevLaunch 无缓存），在线构建也会做无谓的网络请求。
//
// 正确做法：声明一个【专用配置 embeddedLibs】，只挂确实要嵌入的库，
// mod 的 jar 只从它取件。职责清晰，且完全不受其他依赖解析影响。
//
// 注意：配置必须先于 dependencies{} 声明（Gradle 按脚本顺序求值）。
configurations {
    embeddedLibs {
        canBeConsumed = false
        canBeResolved = true
    }
}

dependencies {
    // ===== 机械动力 Create（前置）=====
    // slim jar 不含传递依赖，需手动声明 Ponder / Flywheel / Registrate
    implementation("com.simibubi.create:create-${minecraft_version}:${create_version}:slim") { transitive = false }
    implementation("net.createmod.ponder:ponder-neoforge:${ponder_version}+mc${minecraft_version}")
    compileOnly("dev.engine-room.flywheel:flywheel-neoforge-api-${minecraft_version}:${flywheel_version}")
    runtimeOnly("dev.engine-room.flywheel:flywheel-neoforge-${minecraft_version}:${flywheel_version}")
    implementation("com.tterrag.registrate:Registrate:${registrate_version}")

    // ===== 网络音乐机 Net Music（软联动，非前置）=====
    // 编译期引用其类（探测用），运行时可能不存在——所有调用必须反射。
    // 该 mod 不在任何公共 Maven 仓库，属"需要你自己准备"的依赖：
    //   把 NetMusic 的 jar 放到 libs/netmusic.jar
    // 缺失时下面的 forceCompileOnlyLibs 会自动降级（跳过），不影响其余功能编译。
    def netmusicJar = file("libs/netmusic.jar")
    if (netmusicJar.exists()) {
        compileOnly(files(netmusicJar))
    } else {
        logger.lifecycle("[deps] 未找到 libs/netmusic.jar —— Net Music 软联动将被跳过（其余功能不受影响）")
    }

    // ===== MCEF（网页显示的可选前置，同 Net Music 软联动模式）=====
    // 仅编译期引用（client/web/McefBridge）；运行时由用户自装（Modrinth: mcef）。
    // 未安装时 WebScreenManager 的 isMcefLoaded() 守卫会阻止 McefBridge 类被加载，
    // 网页媒体源自动失效，其余功能不受影响。MCEF jar 绝不能嵌入（含 CEF 原生库）。
    compileOnly("maven.modrinth:mcef:2.1.6-1.21.1")

    // ===== 以下第三方库统一走 Maven 坐标（原先是 libs/*.jar 本地文件）=====
    // 依赖来源改为声明式，仓库里不再需要提交第三方二进制，clone 后可直接编译。
    //
    // 【为什么用 compileOnly + embeddedLibs 两个配置】
    // 这些库最终会被「平铺嵌入」进 mod jar（见文件末尾的 jar 任务），
    // 所以：
    //   compileOnly   —— 只负责编译期能看见这些类，不进 runtimeClasspath
    //   embeddedLibs  —— 只负责打包时把 jar 取出来解压平铺
    // 不用 implementation 是刻意的：implementation 会把它们放进 runtimeClasspath，
    // 而 NeoForge 运行时并不需要（类已在 jar 里），反而增加解析与冲突风险。
    //
    // 平铺而非 jarJar 嵌套：嵌套 jar 会触发 NeoForge SecureJar 读取 bug
    // （invalid stored block lengths），平铺成普通 class 条目才安全。

    // ZXing 二维码生成（扫码登录用；zxing-core 零传递依赖）
    compileOnly("com.google.zxing:core:${zxing_version}")

    // JCodec 视频解码（MP4/M4V/MOV，纯 Java，H.264）
    // jcodec-core 解码 + jcodec-javase 提供 AWTUtil（YUV→BufferedImage）
    compileOnly("org.jcodec:jcodec:${jcodec_version}")
    compileOnly("org.jcodec:jcodec-javase:${jcodec_version}")

    // TwelveMonkeys WebP 解码（纯 Java；处理被误命名为 .png/.jpg 的 WebP 图）
    // imageio-core 运行期依赖 common-lang（com.twelvemonkeys.lang.Validate），
    // 三件套版本必须一致，统一用 twelvemonkeys_version。
    compileOnly("com.twelvemonkeys.imageio:imageio-webp:${twelvemonkeys_version}")
    compileOnly("com.twelvemonkeys.imageio:imageio-core:${twelvemonkeys_version}")
    compileOnly("com.twelvemonkeys.common:common-lang:${twelvemonkeys_version}")

    // 打包取件配置：只声明确实要嵌入的库
    embeddedLibs("com.google.zxing:core:${zxing_version}") { transitive = false }
    embeddedLibs("org.jcodec:jcodec:${jcodec_version}") { transitive = false }
    embeddedLibs("org.jcodec:jcodec-javase:${jcodec_version}") { transitive = false }
    // TwelveMonkeys 走传递依赖，确保 common-lang 被自动带出
    embeddedLibs("com.twelvemonkeys.imageio:imageio-webp:${twelvemonkeys_version}")
    embeddedLibs("com.twelvemonkeys.imageio:imageio-core:${twelvemonkeys_version}")
    embeddedLibs("com.twelvemonkeys.common:common-lang:${twelvemonkeys_version}")
}

// ===== 打包 =====
// 嵌入库不再平铺进 jar 任务，改由 shadowJar 重定位后并入（见下方 shadowJar 块）。
tasks.withType(JavaCompile).configureEach {
    options.encoding = "UTF-8"
}

tasks.named("jar") {
    // 普通 jar 仅作编译产物参考（不含嵌入库），出货以 shadowJar 为准
    archiveClassifier = "unshaded"
}

shadowJar {
    archiveClassifier = ""
    // 只打包本模组自己的类与资源；嵌入库通过下方 from 显式加入。
    // （默认会并入 runtimeClasspath，会把 Create/Flywheel 等打进来，必须清空）
    // 注意：ShadowJar 任务自身有 configurations 属性，这里设置的是任务的打包配置，
    // 而下方 from 闭包里必须用 project.configurations 显式取工程的 embeddedLibs，
    // 否则闭包解析到任务属性（空列表），嵌入库会静默丢失（1.1.5 首build踩坑）。
    configurations = []
    from({
        project.configurations.embeddedLibs.findAll { it.name.endsWith(".jar") }
                .collect { zipTree(it) }
    }) {
        // 排除 META-INF/**：尤其是 SPI 服务文件（TwelveMonkeys 的 ImageReaderSpi），
        // 多个 jar 的 META-INF/services 同名文件合并会冲突；WebP reader 改为代码直接实例化。
        exclude "META-INF/**"
        exclude "module-info.class"
        duplicatesStrategy = DuplicatesStrategy.EXCLUDE
    }
    // 三个嵌入库整体搬到我们自己的命名空间（字节码常量池同步改写，
    // 本模组代码里对它们的 import 引用也会被一并改写，无需改源码）。
    relocate "com.twelvemonkeys", "com.flapdisplayplus.shaded.twelvemonkeys"
    relocate "com.google.zxing", "com.flapdisplayplus.shaded.zxing"
    relocate "org.jcodec", "com.flapdisplayplus.shaded.jcodec"
}

// 出货走 shadowJar
tasks.named("assemble") {
    dependsOn tasks.named("shadowJar")
}
